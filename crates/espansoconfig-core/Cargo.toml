[package]
name = "espansoconfig-core"
description = "Fidelity-preserving espanso YAML configuration engine. Never depends on tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ---------------------------------------------------------------------------
# IMPORTANT: this crate must NEVER depend on tauri, directly or transitively.
# It is the standalone, independently testable and fuzzable domain library
# described in IMPLEMENTATION_PLAN.md section 6.1.
# ---------------------------------------------------------------------------
[dependencies]
# Serialization for the read model only. The Tauri boundary in Phase 1b is a
# thin wrapper over these types, so they must cross it without a second copy of
# every struct. `serde` pulls in no platform code and no tauri.
serde.workspace = true
sha2.workspace = true
# The YAML substrate chosen in Phase 0a (docs/parser-evaluation.md). It is
# confined to `crate::syntax`; no other module may import it.
saphyr-parser.workspace = true
# Plan section 6.6 step 5 names this crate by name: a `regex:` trigger must
# compile under the Rust `regex` crate. Added at Phase 2a-2a, the first
# production dependency since Phase 0a, and confined to `crate::validate`.
# It pulls in no platform code and no tauri.
regex.workspace = true
# The native filesystem watcher (Phase 2d-1, plan section 6.5). Confined to
# `crate::watch::native`; no other module may import it. The callback
# contributes only path hints — debounce, stability, hashing, projection and
# validation are the injected-clock/injected-reader engine's, so the hard part
# stays testable with no filesystem at all and deterministic in observation
# shapes, revisions and order (the identity values inside a projection come
# from the process-wide session table; the engine's module docs state the
# qualification). It pulls in no
# tauri (the architecture check `cargo tree -p espansoconfig-core | rg tauri`
# is unchanged and must find nothing).
notify.workspace = true

# ---------------------------------------------------------------------------
# macOS only, and for exactly one call: `fcopyfile(3)` with
# `COPYFILE_ACL | COPYFILE_XATTR`, which carries the target's access control
# list and its extended attributes onto the temp file before the rename
# installs a new inode (Phase 2a-3a, plan section 7 row 11).
#
# It is declared under a target section rather than in `[dependencies]` so that
# a build for any other target does not see it at all: `crate::persist::write`
# compiles the copy to a documented no-op there, and the crate stays buildable
# and testable off macOS (plan section 6.1). `libc` has no dependencies of its
# own and **pulls in no tauri**; the architecture check is unchanged and is
#   cargo tree -p espansoconfig-core | rg tauri   # must find nothing
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
# Only the tests need a concrete format: they assert the read model actually
# serializes, which a `derive` alone does not prove.
serde_json.workspace = true
tempfile.workspace = true
yaml-rust2.workspace = true
marked-yaml.workspace = true
