[workspace]
resolver = "2"
members = ["crates/espansoconfig-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/ccarpiog/espansoConfig"

# Shared dependency versions. Every member crate inherits from here so the
# workspace can never end up with two versions of the YAML substrate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
yaml-rust2 = "0.11"
saphyr-parser = "0.0.11"
marked-yaml = "0.8"
# Phase 2a-2a, plan section 6.6 step 5: "Regex compiles under the Rust `regex`
# crate". **Default features on purpose.** Espanso 2.3.0 depends on
# `regex = "1.5.5"` with default features, and dropping `unicode` here would
# make patterns such as `\p{Greek}` fail to compile for us while espanso
# accepts them — a rule firing on a working configuration. The version gap is
# real and is recorded in docs/decisions/2a-2a-notes.md section 5: a successful
# compile here is not proof of a successful compile there.
regex = "1.13"
# Phase 2a-3a, plan section 7 row 11: the atomic save installs a **new inode**,
# so the target's extended attributes and its access control list have to be
# copied onto the temp file before the rename or they are dropped — and dropping
# a *denying* ACL broadens access. The copy is macOS's `copyfile(3)`, and this is
# the crate that declares it. **A platform binding and nothing else**: `libc` has
# no dependencies of its own, contains no platform code beyond the declarations,
# and pulls in no tauri. `crates/espansoconfig-core/Cargo.toml` names it only
# inside a `cfg(target_os = "macos")` target section, so a build for any other
# target never sees it and the call site compiles to a documented no-op. The
# architecture check is unchanged and is
#   cargo tree -p espansoconfig-core | rg tauri   # must find nothing
libc = "0.2"
# The application shell only. Declared here, not in `src-tauri/Cargo.toml`,
# purely so the version lives with every other pinned version — it must never
# be inherited by `espansoconfig-core` (CLAUDE.md section 3).
tauri = "2"
tauri-build = "2"
# The application shell's TEST code only, and for one purpose: the contract
# checks in `src-tauri` parse Rust instead of scanning it line by line. Phase
# 1b-2b's review found three ways a line scanner fails open — an attribute and a
# variant on one line, two variants on one line, and a block comment that closes
# mid-line — and all three are properties of scanning text rather than bugs in
# any one scanner. Declared here with every other pinned version, and a
# dev-dependency of `src-tauri` alone: `crates/espansoconfig-core/Cargo.toml`
# names neither of these in any section, and never names tauri (CLAUDE.md
# section 3). The architecture check is unchanged and is
#   cargo tree -p espansoconfig-core | rg tauri   # must find nothing
# `rg syn` over that tree is NOT a check: `serde_derive` is a proc-macro crate
# built on `syn`, so `syn` has been in the core's graph since Phase 0.
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
